<!doctype html>
<html lang="ko">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>잠꼬대 자물쇠 미로</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 밤하늘 위에 한 장짜리 게임 판. 위에서부터 상태줄 → 미로 지도 → 잠꼬대 → 입력 → 돌발 상황 패널 */
:root {
  color-scheme: dark;
  --sky: #1B1A33;        /* 밤하늘 (파이썬 버전 BG) */
  --sky-deep: #12112A;   /* 이펙트 카드의 한밤중 */
  --panel: #262447;      /* 판 바탕 */
  --line: #3B3868;       /* 지도 연결선, 테두리 */
  --moon: #E8E3C8;       /* 달빛 글자 */
  --muted: #A29FC4;      /* 흐린 글자 */
  --lamp: #F5C85C;       /* 등불: 지금 있는 방, 버튼 */
  --lamp-ink: #2A2238;
  --door: #8C6FD1;       /* 문 앞 보랏빛 */
  --dawn: #7FCB9A;       /* 열린 출구 새벽빛 */
  --locked: #2E2C4E;     /* 어둠에 묻힌 잠긴 방 */
  --rose: #F08AA0;       /* 체력 */
  --warn: #FF8D7A;       /* 오류 기록 */
  --display: "Jua", "Gowun Dodum", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
html, body { min-height: 100%; }
body {
  background: var(--sky);
  color: var(--moon);
  font-family: var(--body);
  font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.moon {
  position: fixed; z-index: 0; pointer-events: none;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: max(22px, calc(env(safe-area-inset-right, 0px) + 22px));
  font-size: 42px; color: var(--moon); text-shadow: 0 0 22px rgba(232,227,200,.45);
}
.game { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }

header h1 {
  font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0;
  letter-spacing: .02em; text-wrap: balance;
}
header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

.status { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-family: var(--display); font-size: 20px; }
.status .hp { color: var(--rose); letter-spacing: .08em; }
.status .pieces { font-variant-numeric: tabular-nums; }

.board {
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 16px; display: grid; gap: 16px;
}

/* 미로 지도: 방 칸과 연결선 칸을 바둑판처럼 배치 */
.map { display: grid; grid-template-columns: 1fr 22px 1fr 22px 1fr; grid-template-rows: auto 22px auto 22px auto; align-items: center; }
.link-h { height: 3px; background: var(--line); }
.link-v { width: 3px; height: 100%; background: var(--line); justify-self: center; }
.room {
  font: inherit; font-family: var(--display); font-size: 16px; line-height: 1.25; word-break: keep-all;
  min-height: 64px; padding: 8px 4px; border-radius: 10px; cursor: pointer;
  border: 2px solid transparent; background: var(--moon); color: var(--lamp-ink);
  display: grid; place-items: center; text-align: center;
  transition: transform .12s ease, background-color .2s ease;
}
.room small { display: block; font-family: var(--body); font-size: 12px; opacity: .85; }
.room:hover { transform: translateY(-2px); }
.room:focus-visible, .open-btn:focus-visible, #answer:focus-visible, .modal button:focus-visible, .check input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.room.here { background: var(--lamp); box-shadow: 0 0 18px rgba(245,200,92,.45); }
.room.locked { background: var(--locked); color: var(--muted); border-color: var(--line); }
.room.door { background: var(--door); color: #fff; border-color: #B9A2F0; }
.room.exit-open { background: var(--dawn); color: var(--lamp-ink); }

.speech { display: grid; gap: 6px; min-height: 88px; }
.wake { font-size: 13px; color: var(--muted); }
.hint { font-size: 18px; transition: color .2s; }
.hint.lv0 { color: #9C8FD0; font-style: italic; }
.hint.lv1 { color: #C7B8FF; }
.hint.lv2 { color: var(--lamp); font-weight: 700; }
.msg { font-size: 15px; color: var(--moon); }

.answer-row { display: flex; gap: 8px; }
#answer {
  flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 10px 12px;
  background: var(--sky-deep); color: var(--moon); caret-color: var(--lamp);
  border: 2px solid var(--lamp); border-radius: 10px;
}
.open-btn {
  font: inherit; font-family: var(--display); font-size: 18px; padding: 0 22px;
  background: var(--lamp); color: var(--lamp-ink); border: 0; border-radius: 10px; cursor: pointer;
}
.open-btn:active { filter: brightness(.9); }

/* 돌발 상황 시연 패널 */
.safety { display: grid; gap: 10px; border-top: 1px dashed var(--line); padding-top: 14px; }
.safety-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: center; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--lamp); }
.blocked { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log {
  font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--muted);
  background: var(--sky-deep); border-radius: 8px; padding: 8px 10px;
  max-height: 132px; overflow: auto; white-space: pre-wrap; word-break: break-all;
}
.log .err { color: var(--warn); }
.log .ok { color: var(--dawn); }
.log-label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }

/* 꿈 조각 이펙트 카드 (260×110) */
.veil { position: fixed; inset: 0; z-index: 5; }
.effect {
  position: fixed; left: 50%; top: 50%; translate: -50% -50%; z-index: 6;
  width: 260px; height: 110px; max-width: calc(100% - 32px);
  background: var(--sky-deep); border: 2px solid var(--lamp); border-radius: 12px; overflow: hidden;
}
.effect canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.effect .title, .effect .sub { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--display); }
.effect .title { top: 26px; color: var(--lamp); }
.effect .sub { top: 64px; color: var(--moon); font-size: 16px; }

/* 탈출 성공/실패 창 */
.modal-back { position: fixed; inset: 0; z-index: 10; background: rgba(10,9,26,.72); display: grid; place-items: center; padding: 16px; }
.modal {
  width: min(320px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px 20px 18px; display: grid; gap: 10px; text-align: center;
}
.modal h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; }
.modal p { margin: 0; color: var(--muted); }
.modal button { justify-self: center; font: inherit; font-family: var(--display); font-size: 17px; padding: 8px 34px; margin-top: 6px; background: var(--lamp); color: var(--lamp-ink); border: 0; border-radius: 10px; cursor: pointer; }

@media (max-width: 420px) {
  .room { font-size: 14px; min-height: 58px; }
  header h1 { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  .room { transition: none; }
  .room:hover { transform: none; }
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="moon" aria-hidden="true">☾</div>

<main class="game">
  <header>
    <h1>잠꼬대 자물쇠 미로</h1>
    <p>졸린 잠꾸러기의 잠꼬대를 듣고 자물쇠를 열어 꿈 조각 5개를 모으면 새벽 문이 열려요. 잠긴 방은 7개라 두 곳은 건너뛰어도 돼요.</p>
  </header>

  <div class="status" aria-live="polite">
    <span class="pieces" id="pieces">✨ 꿈 조각 0/5</span>
    <span class="hp" id="hp" aria-label="체력">체력 ♥♥♥</span>
  </div>

  <section class="board">
    <div class="map" id="map" aria-label="미로 지도"></div>

    <div class="speech" aria-live="polite">
      <div class="wake" id="wake"></div>
      <div class="hint" id="hint"></div>
      <div class="msg" id="msg">잠긴 방을 눌러 문 앞에 서 보세요.</div>
    </div>

    <form class="answer-row" id="answer-form" autocomplete="off">
      <input id="answer" type="text" inputmode="text" placeholder="정답 (예: 10)" aria-label="정답">
      <button class="open-btn" type="submit">열기</button>
    </form>

    <div class="safety">
      <div class="safety-top">
        <label class="check"><input type="checkbox" id="safety" checked> 입력 검사 켜기 (끄면 돌발 상황 재현)</label>
        <span class="blocked" id="blocked">엉뚱한 입력을 막은 횟수: 0</span>
      </div>
      <div class="log-label">검사 기록</div>
      <div class="log" id="log" role="log"></div>
    </div>
  </section>
</main>

<script>
// ───────── 게임 데이터 (파이썬 sleepy_maze_final.py와 같은 구조) ─────────
// 지도 (3×3, 9칸)
//  [이불 방]  ─ [베개 방]  ─ [자장가 방]
//     │                        │
//  [양털 방]  ─ [하품 광장]   [달빛 복도]
//     │           │            │
//  [꿈 다락]  ─ [졸음 창고] ─ [새벽 문]
const START = "이불 방", EXIT = "새벽 문";
const ROOMS = ["이불 방", "베개 방", "자장가 방", "양털 방", "하품 광장", "달빛 복도", "꿈 다락", "졸음 창고", "새벽 문"];
const NEIGHBORS = {
  "이불 방": ["베개 방", "양털 방"],
  "베개 방": ["이불 방", "자장가 방"],
  "자장가 방": ["베개 방", "달빛 복도"],
  "양털 방": ["이불 방", "하품 광장", "꿈 다락"],
  "하품 광장": ["양털 방", "졸음 창고"],
  "달빛 복도": ["자장가 방", "새벽 문"],
  "꿈 다락": ["양털 방", "졸음 창고"],
  "졸음 창고": ["하품 광장", "꿈 다락", "새벽 문"],
  "새벽 문": ["달빛 복도", "졸음 창고"],
};
// 지도 칸 위치 [행, 열] (연결선 칸 포함 5×5 바둑판)
const POSITIONS = {
  "이불 방": [1, 1], "베개 방": [1, 3], "자장가 방": [1, 5],
  "양털 방": [3, 1], "하품 광장": [3, 3], "달빛 복도": [3, 5],
  "꿈 다락": [5, 1], "졸음 창고": [5, 3], "새벽 문": [5, 5],
};
const DOORS = {
  "베개 방": { question: "둘 더하기 셋", answer: 5 },
  "자장가 방": { question: "칠 더하기 삼", answer: 10 },
  "양털 방": { question: "넷 곱하기 둘", answer: 8 },
  "하품 광장": { question: "아홉 빼기 넷", answer: 5 },
  "달빛 복도": { question: "여섯 더하기 여섯", answer: 12 },
  "꿈 다락": { question: "셋 곱하기 셋", answer: 9 },
  "졸음 창고": { question: "여덟 더하기 일곱", answer: 15 },
};
const GOAL = 5, MAX_HP = 3, MIN_ANSWER = 0, MAX_ANSWER = 99;
const SLEEP_STATES = [
  { text: "잠꾸러기: 쿨쿨… zzZ (깊이 잠듦)" },
  { text: "잠꾸러기: 뒤척뒤척… zZ (반쯤 깸)" },
  { text: "잠꾸러기: 번쩍! (잠이 깸)" },
];
const KOREAN_NUMBERS = {
  "영": 0, "공": 0, "하나": 1, "둘": 2, "셋": 3, "넷": 4, "다섯": 5, "여섯": 6, "일곱": 7, "여덟": 8, "아홉": 9, "열": 10,
  "일": 1, "이": 2, "삼": 3, "사": 4, "오": 5, "육": 6, "칠": 7, "팔": 8, "구": 9, "십": 10,
};

let state;
function newGame() {
  state = {
    here: START,
    locked: Object.fromEntries(ROOMS.map(r => [r, r !== START])),   // 시작 방 빼고 모두 잠김
    door: null,                 // 지금 서 있는 문 (잠긴 방 이름)
    pieces: 0,
    hp: MAX_HP,
    wrongAt: Object.fromEntries(Object.keys(DOORS).map(r => [r, 0])),
    blocked: 0,
    busy: false,                // 이펙트·알림창 중에는 입력을 막음
  };
  $("answer").value = "";
  setMsg("잠긴 방을 눌러 문 앞에 서 보세요.");
  showHint(null);
  render();
}

const $ = id => document.getElementById(id);
function setMsg(t) { $("msg").textContent = t; }

// ───────── 화면 그리기 ─────────
function buildMap() {
  const map = $("map");
  // 연결선: 이어진 두 방 사이 칸에 가로(─) 또는 세로(│) 선을 그림
  for (const a of ROOMS) for (const b of NEIGHBORS[a]) {
    if (ROOMS.indexOf(a) > ROOMS.indexOf(b)) continue;   // 같은 선을 두 번 그리지 않게
    const [r1, c1] = POSITIONS[a], [r2, c2] = POSITIONS[b];
    const d = document.createElement("div");
    d.className = r1 === r2 ? "link-h" : "link-v";
    d.style.gridRow = (r1 + r2) / 2; d.style.gridColumn = (c1 + c2) / 2;
    map.appendChild(d);
  }
  for (const room of ROOMS) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "room"; b.id = "room-" + room;
    b.style.gridRow = POSITIONS[room][0]; b.style.gridColumn = POSITIONS[room][1];
    b.addEventListener("click", () => clickRoom(room));
    map.appendChild(b);
  }
}

function render() {
  for (const room of ROOMS) {
    const b = $("room-" + room);
    b.className = "room";
    let sub = "";
    if (room === state.here) { b.classList.add("here"); sub = "여기"; }
    else if (room === state.door) { b.classList.add("door"); sub = "문 앞"; }
    else if (state.locked[room]) { b.classList.add("locked"); sub = "잠김"; }
    else if (room === EXIT) { b.classList.add("exit-open"); sub = "열림!"; }
    const label = room === state.here ? "★ " + room : room;
    b.innerHTML = label + (sub ? `<small>${sub}</small>` : "");
  }
  $("pieces").textContent = `✨ 꿈 조각 ${state.pieces}/${GOAL}`;
  $("hp").textContent = "체력 " + "♥".repeat(state.hp) + "♡".repeat(MAX_HP - state.hp);
  $("blocked").textContent = "엉뚱한 입력을 막은 횟수: " + state.blocked;
}

// ───────── 잠꼬대: 틀릴수록 또렷해짐 ─────────
function awakeLevel(room) { return Math.min(state.wrongAt[room], 2); }
function showHint(room) {
  const hint = $("hint"), wake = $("wake");
  if (!room) { hint.textContent = ""; wake.textContent = ""; hint.className = "hint"; return; }
  const q = DOORS[room].question, lv = awakeLevel(room);
  // 낱말 순서는 절대 바꾸지 않음: "아홉 빼기 넷"이 "넷 빼기 아홉"(음수)으로 읽히지 않게
  const words = q.split(" ");
  const flip = w => [...w].reverse().join("");
  let said;
  if (lv === 0) said = `${flip(words[0])}… 쿨쿨… ${flip(words[2])}...`;            // 계산 말은 코 고는 소리에 묻힘
  else if (lv === 1) said = words.map((w, i) => i === 1 ? flip(w) : w).join(" ") + "..."; // 숫자는 또렷, 계산 말만 뒤섞임
  else said = q + " = ?";                                                         // 또렷한 문장
  wake.textContent = SLEEP_STATES[lv].text;
  hint.textContent = `잠꼬대: “${said}”`;
  hint.className = "hint lv" + lv;
}

// ───────── 방 클릭 ─────────
function clickRoom(room) {
  if (state.busy) return;
  if (room === state.here) { setMsg("이미 여기 있어요."); return; }
  if (!NEIGHBORS[state.here].includes(room)) {
    setMsg(`${room}까지는 너무 멀어요… 선으로 이어진 방만 갈 수 있어요.`); return;
  }
  if (room === EXIT && state.locked[EXIT]) {
    setMsg(`${EXIT}이 잠겨 있어요. 꿈 조각이 ${GOAL - state.pieces}개 더 필요해요.`); return;
  }
  if (state.locked[room]) {
    state.door = room;
    showHint(room);
    setMsg(`${room} 문 앞이에요. 잠꼬대를 듣고 정답을 입력하세요.`);
    render();
    $("answer").focus();
    return;
  }
  state.here = room; state.door = null; showHint(null);
  render();
  if (room === EXIT) { gameClear(); return; }
  setMsg(`${room}(으)로 왔어요.`);
}

// ───────── 돌발 상황 해결: 입력 검사 ─────────
function parseAnswer(raw) {
  let t = raw.normalize("NFKC");              // ① 전각 숫자 １０ → 10
  t = t.replace(/\s+/g, "");                  // ② 띄어쓰기 지우기
  if (t === "") return [null, "아무 말도 안 했어… 숫자를 적어 줘…"];                 // ③
  if (t.length > 10) return [null, "졸려서 다 못 들었어… 짧게 말해 줘…"];           // ④
  if (t in KOREAN_NUMBERS) return [KOREAN_NUMBERS[t], null];                      // ⑤
  if (![...t].every(ch => "0123456789.-+".includes(ch)))
    return [null, `“${raw.trim()}”…? 그건 숫자가 아니야… 숫자로 말해 줘…`];          // ⑥
  if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(t))
    return [null, `“${raw.trim()}”…? 그건 숫자가 아니야… 숫자로 말해 줘…`];          // ⑦
  const f = parseFloat(t);
  if (!Number.isInteger(f)) return [null, "소수점이 없어… 자물쇠 숫자는 딱 떨어지는 수야…"]; // ⑧
  if (f < MIN_ANSWER || f > MAX_ANSWER) return [null, `${MIN_ANSWER}부터 ${MAX_ANSWER} 사이로 말해 줘…`]; // ⑨
  return [f, null];
}

// 검사를 끈 상태: 파이썬 int()처럼 그대로 바꾸다가 실패하면 오류
function pythonInt(raw) {
  const t = raw.normalize("NFKC").trim().replace(/(\d)_(?=\d)/g, "$1");
  if (!/^[+-]?\d+$/.test(t)) {
    const e = new Error(`invalid literal for int() with base 10: '${raw}'`);
    e.name = "ValueError"; throw e;
  }
  return parseInt(t, 10);
}

function log(text, cls) {
  const el = $("log"), line = document.createElement("div");
  line.textContent = text; if (cls) line.className = cls;
  el.appendChild(line);
  while (el.children.length > 40) el.firstChild.remove();
  el.scrollTop = el.scrollHeight;
}

// ───────── 정답 입력 ─────────
function tryOpen() {
  if (state.busy) return;
  const raw = $("answer").value;
  if (!state.door) { setMsg("먼저 지도에서 잠긴 방을 눌러 문 앞에 서 주세요…"); return; }
  const room = state.door;
  let number;
  if ($("safety").checked) {
    const [n, problem] = parseAnswer(raw);
    if (problem) {
      state.blocked++;
      log(`[입력 검사] ${pyRepr(raw)} → 막음: ${problem}`);
      setMsg("음냐… " + problem);
      $("answer").select();
      render();
      return;                                 // 체력은 깎지 않음
    }
    log(`[입력 검사] ${pyRepr(raw)} → 숫자 ${n}(으)로 알아들음`, "ok");
    number = n;
  } else {
    log(`[검사 꺼짐] ${pyRepr(raw)} 를 int()로 바로 바꿔 봅니다…`);
    try { number = pythonInt(raw); }
    catch (e) {
      log(`Traceback (most recent call last):\n  File "sleepy_maze_final.py", in try_open\n${e.name}: ${e.message}`, "err");
      return;                                 // 파이썬처럼 아무 반응 없이 멈춤
    }
  }

  $("answer").value = "";
  if (number === DOORS[room].answer) {
    state.locked[room] = false;
    state.here = room; state.door = null;
    if (state.pieces >= GOAL) {               // 이미 다 모았으면 조각을 더 주지 않음 (최대 GOAL개)
      showHint(null);
      setMsg(`딸깍! 문은 열렸지만 꿈 조각은 이미 다 모았어요. ${EXIT}으로 가세요.`);
      render();
      return;
    }
    state.pieces++;
    const last = state.pieces >= GOAL;
    if (last) state.locked[EXIT] = false;
    showHint(null);
    setMsg(last ? `딸깍! ${EXIT}이 열렸어요! 이어진 방을 따라 ${EXIT}으로 가세요.` : "딸깍! 자물쇠가 열렸어요.");
    render();
    pieceEffect(last);
  } else {
    state.hp--;
    state.wrongAt[room]++;
    showHint(room);
    setMsg(`덜컥… 열리지 않아요. (남은 체력 ${state.hp})`);
    render();
    if (state.hp <= 0) gameOver();
  }
}

function pyRepr(s) { return "'" + s.replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "'"; }

// ───────── 꿈 조각 획득 이펙트 (작은 카드, 약 0.75초) ─────────
const STAR_COUNT = 12, TOTAL_FRAMES = 25, TITLE_MAX = 18;
const STAR_COLORS = ["#F5C85C", "#FFFFFF", "#FFE7A3", "#E8E3C8"];
function pieceEffect(last) {
  state.busy = true;
  ding();
  const veil = document.createElement("div"); veil.className = "veil";
  const card = document.createElement("div"); card.className = "effect"; card.setAttribute("role", "status");
  const cv = document.createElement("canvas");
  const title = document.createElement("div"); title.className = "title";
  const sub = document.createElement("div"); sub.className = "sub";
  title.textContent = last ? "✨ 마지막 꿈 조각! ✨" : "✨ 꿈 조각 획득! ✨";
  sub.textContent = last ? `${EXIT}이 열렸어요!` : `${state.pieces} / ${GOAL}`;
  card.append(cv, title, sub);
  document.body.append(veil, card);

  const W = card.clientWidth, H = card.clientHeight, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let frame = 0;
  function animate() {
    const p = frame / TOTAL_FRAMES;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < STAR_COUNT; i++) {
      const angle = (Math.PI * 2 / STAR_COUNT) * i;
      const dist = 8 + p * (W / 2 - 10);
      ctx.globalAlpha = 1 - p;
      ctx.fillStyle = STAR_COLORS[i % STAR_COLORS.length];
      ctx.font = `${10 + (i % 2) * 4}px sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("✦", W / 2 + Math.cos(angle) * dist, H / 2 + Math.sin(angle) * dist * 0.5);
    }
    ctx.globalAlpha = 1;
    title.style.fontSize = (reduce ? TITLE_MAX : 10 + Math.min(1, p * 2) * (TITLE_MAX - 10)) + "px";
    sub.style.opacity = Math.min(1, p * 3);
    if (frame < TOTAL_FRAMES) { frame++; setTimeout(animate, 30); }
    else { card.remove(); veil.remove(); state.busy = false; $("answer").focus(); }
  }
  animate();
}

let audio;
function ding() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine"; o.frequency.value = 1320;
    g.gain.setValueAtTime(0.18, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.5);
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + 0.5);
  } catch (e) { /* 소리가 안 나도 게임은 계속 */ }
}

// ───────── 탈출 성공 / 실패 창 ─────────
function showModal(title, text) {
  state.busy = true;
  const back = document.createElement("div"); back.className = "modal-back";
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title"></h2><p></p><p>확인을 누르면 처음부터 다시 시작해요.</p><button type="button">확인</button></div>`;
  back.querySelector("h2").textContent = title;
  back.querySelector("p").textContent = text;
  const btn = back.querySelector("button");
  btn.addEventListener("click", () => { back.remove(); newGame(); });
  document.body.appendChild(back);
  btn.focus();
}
function gameOver() {
  showModal("탈출 실패", "체력이 모두 떨어졌어요. 잠꾸러기가 다시 깊이 잠들었어요…");
}
function gameClear() {
  showModal("탈출 성공", `꿈 조각 ${GOAL}개를 모아 미로를 빠져나왔어요! 남은 체력 ${"♥".repeat(state.hp)}${"♡".repeat(MAX_HP - state.hp)}`);
}

// ───────── 밤하늘: 별 70개, 0.2초마다 하나씩 반짝 ─────────
const sky = $("sky"), sctx = sky.getContext("2d");
let stars = [];
function makeSky() {
  const dpr = window.devicePixelRatio || 1;
  sky.width = innerWidth * dpr; sky.height = innerHeight * dpr;
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = Array.from({ length: 70 }, () => ({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: 0.8 + Math.random() * 1.6, a: 0.35 + Math.random() * 0.4, glow: 0,
  }));
  drawSky();
}
function drawSky() {
  sctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const s of stars) {
    sctx.beginPath();
    sctx.fillStyle = `rgba(232,227,200,${Math.min(1, s.a + s.glow)})`;
    sctx.arc(s.x, s.y, s.r + s.glow * 1.4, 0, Math.PI * 2);
    sctx.fill();
  }
}
function twinkle() {
  for (const s of stars) s.glow = Math.max(0, s.glow - 0.25);
  const s = stars[Math.floor(Math.random() * stars.length)];
  if (s) s.glow = 0.9;
  drawSky();
}
makeSky();
addEventListener("resize", makeSky);
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(twinkle, 200);

// ───────── 시작 ─────────
buildMap();
$("answer-form").addEventListener("submit", e => { e.preventDefault(); tryOpen(); });
$("safety").addEventListener("change", e => {
  log(e.target.checked ? "── 입력 검사 켬 (해결) ──" : "── 입력 검사 끔 (돌발 상황 재현) ──", e.target.checked ? "ok" : "err");
});
newGame();
log("검사 기록이 여기에 남아요. 문 앞에서 열, ten, -5 같은 값을 넣어 보세요.");
</script>
